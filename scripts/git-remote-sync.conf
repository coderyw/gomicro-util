# 递归扫描的工作项目根目录
ROOT_DIRS=(
  "/Users/weienenp/work/ns"
)

# 只执行这些项目。留空表示执行 ROOT_DIRS 下发现的所有 git 仓库。
# 支持仓库名、绝对路径，或根目录下的相对路径后缀。
ONLY_PROJECTS=(
  # "ca-common-util"
  # "/Users/weienenp/work/ns/some-project"
  "ca-user"
)

# 排除项目。支持规则同 ONLY_PROJECTS。
EXCLUDE_PROJECTS=(
)

# 默认处理的 remote 名称
REMOTE_NAME="origin"

# 拉取与推送涉及的分支
SOURCE_BRANCH="main"
TARGET_BRANCH="saas/feat-nsMain-v0.0.0.0"

# remote url 中的 token 替换规则
# 脚本会把当前 remote url 中命中的 token 替换为下面目标 token。
# 如果当前 remote 已经是目标 token，则不会再次替换。
PULL_URL_TOKEN="18b23414ec9e475a8b56861b69afca68"
PUSH_URL_TOKEN="029775cd9f3047e28f0fe56ec9159a49"

# 可选：把你环境中 remote url 里可能出现的其他 token 也列出来，方便脚本识别并替换。
URL_TOKEN_CANDIDATES=(
  "18b23414ec9e475a8b56861b69afca68"
  "029775cd9f3047e28f0fe56ec9159a49"
)

# 同步模式：
# pull-push: 默认，切到 pull remote 后，把远程 main 更新到本地目标分支，再切到 push remote 推送。
# fetch-push: 只 fetch 远程 main，再重建本地目标分支到该提交，最后推送。
SYNC_MODE="pull-push"

# 需要切换本地分支；工作区不干净时是否继续。
ALLOW_DIRTY="false"

# 失败时是否把 remote url 恢复为执行前的值。
RESTORE_REMOTE_ON_FAILURE="true"

# true 时只打印命令，不真正执行，建议先试跑一遍。
DRY_RUN="true"

# 是否打印详细日志
VERBOSE="true"
